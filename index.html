<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6"><title>두근두근 방과 후 데이트</title>
<style>
:root{--pink:#ef83ad;--rose:#a84f78;--gold:#d7a35c;--ink:#453541;--paper:#fffafc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 10%,#fff 0,#ffeaf2 45%,#e9f4ff 100%);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif;min-height:100vh}
main{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.logo{font-weight:900;color:var(--rose);font-size:clamp(20px,4vw,30px)}.tag{background:#fff9;border:1px solid #f4c9da;border-radius:30px;padding:8px 13px;font-weight:800}
.panel{background:#ffffffdf;border:1px solid white;border-radius:24px;box-shadow:0 14px 40px #81566a20;overflow:hidden}
.title-screen{position:relative;min-height:680px;display:flex;align-items:center;justify-content:center;text-align:center;padding:36px 24px;background:linear-gradient(180deg,#f8dfe9aa,#dbeeff99),radial-gradient(circle at 50% 20%,#fff 0,#f9dce9 48%,#dbeeff 100%)}
.title-screen:before,.title-screen:after{content:"✿　✧　❀　✦　✿";position:absolute;color:#fff9;font-size:32px;letter-spacing:18px;left:0;right:0;pointer-events:none}.title-screen:before{top:24px}.title-screen:after{bottom:24px}
.title-inner{position:relative;z-index:1;width:min(100%,760px)}.eyebrow{letter-spacing:4px;font-size:12px;font-weight:900;color:#a66a87}.title-screen h1{font-size:clamp(36px,7vw,66px);line-height:1.12;margin:14px 0;color:#a84f78;text-shadow:0 3px #fff,0 8px 25px #b75e8530}.subtitle{font-size:clamp(14px,2vw,18px);color:#765f6d;line-height:1.8;margin:0 auto 24px;max-width:520px}
.cover-girls{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:590px;margin:26px auto}.cover-girl{height:260px;position:relative;overflow:hidden;border-radius:22px;background:#fff9;border:1px solid #fff;box-shadow:0 10px 30px #81566a20}.cover-girl img{position:absolute;width:200%;height:200%;max-width:none;object-fit:contain;top:0;left:0}.cover-girl.k img{left:-100%}.cover-girl .caption{position:absolute;bottom:0;left:0;right:0;padding:10px 4px;background:linear-gradient(transparent,#fff 30%);font-weight:900;color:#8d5271}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}button:active{transform:scale(.98)}.pink{background:var(--pink);color:white;box-shadow:0 5px 14px #ef83ad50}.gold{background:#edc17e;color:#493729;box-shadow:0 5px 14px #d7a35c50}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #f0d4df;color:#594552;margin:9px 0}.choice:hover{background:#fff0f6;border-color:var(--pink)}
.scene{display:grid;grid-template-columns:minmax(240px,40%) 1fr;min-height:550px}.portrait{position:relative;background:linear-gradient(160deg,#fbdce8,#dceeff);overflow:hidden;min-height:550px}.portrait img{position:absolute;width:200%;height:200%;max-width:none;object-fit:fill;top:0;left:0;transition:transform .25s}.story{padding:22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;isolation:isolate;background:linear-gradient(180deg,#e8f5ff 0%,#fff8f1 62%,#f9e7ee 100%)}.story:before{content:"";position:absolute;z-index:-1;inset:0;opacity:.2;background:linear-gradient(90deg,transparent 0 8%,#8caac2 8% 9%,transparent 9% 18%,#8caac2 18% 19%,transparent 19% 28%,#8caac2 28% 29%,transparent 29%),linear-gradient(180deg,transparent 0 38%,#9aafc2 38% 40%,#9aafc2 40% 74%,transparent 74%),repeating-linear-gradient(90deg,transparent 0 42px,#829bb2 43px 48px,transparent 49px 74px);clip-path:polygon(0 18%,100% 18%,100% 76%,0 76%)}.story>*{position:relative}.storytop{display:flex;justify-content:space-between;gap:10px;align-items:center}.meter{height:10px;background:#f5dce7;border-radius:20px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:linear-gradient(90deg,#f18ab3,#edc17e);transition:width .3s}.story-tools{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0 0 8px}.tool-btn{padding:8px 12px;font-size:13px;background:#fff;border:1px solid #f0d4df;color:#79566a}.tool-btn.active{background:#fce3ed;border-color:#ef83ad;color:#a84f78}.log-overlay{position:fixed;inset:0;z-index:20;background:#30243299;display:flex;align-items:center;justify-content:center;padding:14px}.log-box{width:min(680px,100%);max-height:82vh;overflow:auto;background:#fffafc;border-radius:20px;padding:18px;box-shadow:0 15px 50px #0004}.log-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:#fffafc;padding:4px 0 12px}.log-entry{padding:10px 12px;margin:8px 0;border-radius:12px;background:#fff;border:1px solid #f2dce5;line-height:1.6}.log-entry .log-name{font-weight:900;color:#a84f78}.log-entry .log-choice{color:#947184;font-size:13px;margin-top:5px}.dialog{font-size:clamp(16px,2.4vw,20px);line-height:1.9;white-space:pre-line;background:#fffE;border:1px solid #f4dce6;border-radius:18px;padding:18px;margin:20px 0;min-height:118px}.name{display:inline-block;padding:6px 15px;border-radius:20px;background:#f28db6;color:white;font-weight:900}.name.k{background:#e9bb79;color:#493729}.muted{color:#927f8b;font-size:13px}.end{text-align:center;padding:42px 20px}.ending-cg{display:block;width:min(100%,900px);max-height:62vh;object-fit:contain;margin:20px auto;border-radius:18px;box-shadow:0 12px 34px #81566a25}.ending-cg.hidden{display:none}.end h2{font-size:34px;color:#bd6288}.hidden{display:none}
@media(max-width:650px){main{padding:10px}.title-screen{min-height:calc(100vh - 20px);padding:28px 14px}.cover-girls{gap:9px;margin:20px auto}.cover-girl{height:205px}.scene{grid-template-columns:1fr;min-height:0}.portrait{height:min(78vw,410px);min-height:0}.story{padding:14px}.dialog{margin:12px 0;min-height:100px}.top{font-size:13px}}

/* 가로 화면 최적화 */
@media (orientation:landscape) and (max-height:600px){
 body{min-height:100svh}
 main{max-width:1200px;padding:8px}
 .top{margin-bottom:8px}
 .logo{font-size:clamp(17px,3vw,24px)}
 .tag{padding:6px 10px;font-size:12px}
 .title-screen{min-height:calc(100svh - 58px);padding:12px 20px}
 .title-inner{width:100%;max-width:1050px}
 .eyebrow{font-size:10px;letter-spacing:3px}
 .title-screen h1{font-size:clamp(26px,5vw,42px);margin:5px 0}
 .subtitle{font-size:clamp(11px,1.7vw,14px);line-height:1.45;margin-bottom:8px}
 .cover-girls{display:flex;justify-content:center;gap:12px;margin:8px auto;max-width:460px}
 .cover-girl{width:min(30vw,230px);height:clamp(112px,30vh,170px);border-radius:14px}
 .cover-girl .caption{font-size:12px;padding:5px}
 .buttons{gap:8px}
 button{padding:9px 14px;font-size:14px}
 .title-screen:before{top:8px;font-size:20px}
 .title-screen:after{bottom:8px;font-size:20px}
 .scene{grid-template-columns:minmax(0,42%) 1fr;min-height:0;height:calc(100svh - 58px)}
 .portrait{min-height:0;height:100%}
 .story{padding:clamp(10px,2vh,18px);min-height:0}
 .dialog{font-size:clamp(14px,2.2vw,18px);line-height:1.55;padding:12px;margin:10px 0;min-height:0}
 .choice{margin:6px 0;padding:9px 12px}
 .end{padding:20px}
 .end h2{font-size:clamp(24px,4vw,34px)}
}
@media (orientation:landscape) and (max-height:380px){
 .scene{height:calc(100svh - 48px)}
 .top{margin-bottom:4px}
 .title-screen{min-height:calc(100svh - 48px)}
 .cover-girl{height:clamp(94px,27vh,132px)}
 .title-screen h1{font-size:25px}
 .subtitle{margin-bottom:4px}
 .dialog{margin:6px 0;padding:8px}
 .choice{margin:4px 0;padding:7px 10px}
}
</style></head><body><main>
<div class="top"><div class="logo">두근두근 방과 후 데이트 <span style="font-size:11px;letter-spacing:2px;display:block;color:#a88c9b">AFTER SCHOOL, WITH YOU</span></div><div class="tag">♥ 방과 후의 설렘</div></div>
<section id="home" class="panel title-screen">
 <div class="title-inner"><div class="eyebrow">A LITTLE ROMANCE VISUAL NOVEL</div><h1>두근두근<br>방과 후 데이트</h1><p class="subtitle">벚꽃이 흩날리는 하굣길, 두 사람과 함께하는 특별한 하루.<br>당신의 선택으로 오늘의 결말이 달라집니다.</p>
 <div class="cover-girls"><div class="cover-girl"><img src="핑크 머리 소녀 표정 스티커 시트.png" alt="하나조노 하카리 표정 모음"><div class="caption">하나조노 하카리</div></div><div class="cover-girl k"><img src="금발 트윈테일 소녀의 네 가지 표정.png" alt="인다 카라네 표정 모음"><div class="caption">인다 카라네</div></div></div>
 <div class="buttons"><button class="pink" onclick="showRoutes()">스토리</button></div><p class="muted" style="margin-top:18px">스토리를 시작하고 함께할 캐릭터를 선택하세요.</p></div>
</section>
<section id="routeSelect" class="panel title-screen hidden"><div class="title-inner"><div class="eyebrow">CHOOSE YOUR STORY</div><h1 style="font-size:clamp(30px,5vw,48px)">누구와 함께할까요?</h1><p class="subtitle">오늘 방과 후, 함께 시간을 보내고 싶은 상대를 선택해 주세요.</p><div class="buttons"><button class="pink" onclick="start('hakari')">하나조노 하카리 ♥</button><button class="gold" onclick="start('karane')">인다 카라네 ♡</button><button onclick="showHome()">타이틀로 돌아가기</button></div></div></section>
<section id="game" class="panel scene hidden">
<div class="portrait" id="portrait"></div><div class="story"><div><div class="storytop"><span id="charname" class="name">하카리</span><span class="muted">호감도 <b id="score">0</b>/100</span></div><div class="meter"><div class="fill" id="fill"></div></div><div class="dialog" id="dialog"></div><div class="story-tools"><button class="tool-btn" id="skipBtn" onclick="toggleSkip()">스킵 OFF</button><button class="tool-btn" onclick="openLog()">대사 로그</button></div></div><div id="choices"></div></div>
</section>
<section id="ending" class="panel end hidden"><div class="tag">ENDING</div><h2 id="endtitle">해피 엔딩 ♥</h2><p id="endtext"></p><img id="endcg" class="ending-cg hidden" src="karane_happy.jpg" alt="카라네 해피엔딩 일러스트"><p class="muted" id="endscore"></p><button class="pink" onclick="location.reload()">타이틀로 돌아가기 ♡</button></section>
</main><div id="logOverlay" class="log-overlay hidden" onclick="if(event.target===this)closeLog()"><div class="log-box"><div class="log-head"><strong>대사 로그</strong><button class="tool-btn" onclick="closeLog()">닫기 ✕</button></div><div id="logEntries"></div></div></div>
<script>
const scenes={
hakari:[
["하나조노 하카리","어머, 여기 있었네요! 오늘 같이 집에 가지 않을래요?","물론이지!|12","무슨 이야기인데?|7","오늘은 조금 바빠…|-5"],
["하나조노 하카리","에헤헤, 사실은 당신과 조금 더 이야기하고 싶었어요.","나도 그래.|15","무슨 고민 있어?|8","그럼 천천히 걸을까?|12"],
["하나조노 하카리","벚꽃이 정말 예쁘네요. 이런 날은 특별한 추억을 만들고 싶어요.","너와 함께라서 더 예뻐.|20","사진 찍어 줄까?|12","꽃잎 잡기 내기하자!|15"]],
karane:[
["인다 카라네","뭐야, 왜 그렇게 쳐다보는 거야?! 딱히 기다린 건 아니거든!","기다려줘서 고마워.|15","같이 가자, 카라네.|12","그럼 먼저 갈게.|-6"],
["인다 카라네","흥! 네가 원한다면 같이 걸어줄 수도 있지만… 착각하지 마!","네가 있어야 즐거워.|18","오늘 기분 좋아 보여.|12","츤데레네.|-3"],
["인다 카라네","저기… 오늘은 조금 더 같이 있고 싶을지도. 너는 어때?","나도 같이 있고 싶어.|20","조금만 더 걷자.|15","부끄러워하는 거 귀여워.|8"]]
};
let route="",step=0,score=0,skipMode=false,storyLog=[];
function showRoutes(){document.getElementById('home').classList.add('hidden');document.getElementById('routeSelect').classList.remove('hidden')}
function showHome(){document.getElementById('routeSelect').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function start(r){route=r;step=0;score=0;skipMode=false;storyLog=[];updateSkipButton();document.getElementById('home').classList.add('hidden');document.getElementById('routeSelect').classList.add('hidden');document.getElementById('ending').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
let typingTimer=null;
function render(){let s=scenes[route][step],p=document.getElementById('portrait');p.innerHTML='<img src="'+(route==='hakari'?'핑크 머리 소녀 표정 스티커 시트.png':'금발 트윈테일 소녀의 네 가지 표정.png')+'" alt="'+s[0]+' 표정">';let img=p.querySelector('img');img.style.left=(step%2===0?'0':'-100%');img.style.top=(step===0?'0':'-100%');document.getElementById('charname').textContent=s[0];document.getElementById('charname').className='name'+(route==='karane'?' k':'');document.getElementById('score').textContent=score;document.getElementById('fill').style.width=Math.max(0,Math.min(100,score))+'%';let d=document.getElementById('dialog'),c=document.getElementById('choices');d.textContent='';d.style.cursor='pointer';c.innerHTML='';if(typingTimer)clearInterval(typingTimer);storyLog.push({name:s[0],text:s[1],choice:""});let chars=Array.from(s[1]),i=0;function finishTyping(){if(typingTimer)clearInterval(typingTimer);typingTimer=null;d.textContent=s[1];d.style.cursor='default';c.innerHTML='';s.slice(2).forEach(v=>{let [label,n]=v.split('|');let b=document.createElement('button');b.className='choice';b.textContent='♥ '+label;b.onclick=()=>choose(+n);c.appendChild(b)})}d.onclick=()=>{if(typingTimer)finishTyping()};if(skipMode)finishTyping();else typingTimer=setInterval(()=>{d.textContent+=chars[i++]||'';if(i>=chars.length)finishTyping()},38)}
function toggleSkip(){skipMode=!skipMode;updateSkipButton();if(skipMode&&typingTimer)document.getElementById("dialog").click()}function updateSkipButton(){let b=document.getElementById("skipBtn");if(b){b.textContent=skipMode?"스킵 ON":"스킵 OFF";b.classList.toggle("active",skipMode)}}function openLog(){renderLog();document.getElementById("logOverlay").classList.remove("hidden")}function closeLog(){document.getElementById("logOverlay").classList.add("hidden")}function renderLog(){let box=document.getElementById("logEntries");box.innerHTML="";if(!storyLog.length){box.textContent="아직 대사가 없습니다.";return}storyLog.forEach(e=>{let item=document.createElement("div");item.className="log-entry";let name=document.createElement("div");name.className="log-name";name.textContent=e.name;let msg=document.createElement("div");msg.textContent=e.text;item.append(name,msg);if(e.choice){let choice=document.createElement("div");choice.className="log-choice";choice.textContent="▶ "+e.choice;item.appendChild(choice)}box.appendChild(item)});box.scrollTop=box.scrollHeight}function choose(n){let picked=event?.currentTarget?.textContent||"";if(storyLog.length)storyLog[storyLog.length-1].choice=picked.replace(/^♥\s*/,"");score=Math.max(0,Math.min(100,score+n*2));step++;if(step<scenes[route].length){render();return}document.getElementById('game').classList.add('hidden');document.getElementById('ending').classList.remove('hidden');let good=score>=70;document.getElementById('endtitle').textContent=good?'해피 엔딩 ♥':'조금 아쉬운 방과 후';document.getElementById('endtext').textContent=route==='hakari'?(good?'하카리는 환하게 웃으며 당신의 손을 잡았다. “오늘은 정말 행복했어요!”':'하카리는 아쉬운 듯 미소 지으며 다음을 기약했다.'):(good?'카라네는 얼굴을 붉히며 작게 속삭였다. “내일도… 같이 가자.”':'카라네는 고개를 돌렸다. “다음엔 좀 더 잘해 보라고!”');document.getElementById('endcg').classList.toggle('hidden',!(route==='karane'&&good));document.getElementById('endscore').textContent='최종 호감도 '+score+' / 100';}
</script></body></html>
