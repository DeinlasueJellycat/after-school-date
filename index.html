<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6"><title>두근두근 방과 후 데이트</title>
<style>
:root{--pink:#ef83ad;--rose:#b85e83;--gold:#d7a35c;--ink:#453541;--paper:#fffafc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#ffeaf2,#eaf5ff 55%,#fff5e8);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif;min-height:100vh}
main{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.logo{font-weight:900;color:#a84f78;font-size:clamp(20px,4vw,30px)}.tag{background:#fff9;border:1px solid #f4c9da;border-radius:30px;padding:8px 13px;font-weight:800}
.panel{background:#ffffffd9;border:1px solid white;border-radius:22px;box-shadow:0 14px 40px #81566a20;overflow:hidden}.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}.intro{padding:24px}.intro h1{font-size:clamp(28px,5vw,44px);line-height:1.18;margin:8px 0;color:#a84f78}.intro p{line-height:1.8;color:#765f6d}.girls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.girl{background:#fff;border-radius:18px;padding:10px;text-align:center;border:1px solid #f5d5e1}.girl svg{width:100%;height:auto;max-height:280px}.girl h3{margin:4px 0}.girl p{margin:0 0 10px;font-size:13px;color:#816c78}
button{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}button:active{transform:scale(.98)}.pink{background:var(--pink);color:white}.gold{background:#edc17e;color:#493729}.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #f0d4df;color:#594552;margin:9px 0}.choice:hover{background:#fff0f6;border-color:var(--pink)}.scene{display:grid;grid-template-columns:minmax(220px,36%) 1fr;min-height:490px}.portrait{background:linear-gradient(160deg,#fbdce8,#dceeff);display:flex;align-items:end;justify-content:center;overflow:hidden}.portrait svg{width:100%;max-height:500px}.story{padding:20px;display:flex;flex-direction:column;justify-content:space-between}.storytop{display:flex;justify-content:space-between;gap:10px;align-items:center}.meter{height:10px;background:#f5dce7;border-radius:20px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:linear-gradient(90deg,#f18ab3,#edc17e);transition:width .3s}.dialog{font-size:clamp(16px,2.4vw,20px);line-height:1.9;white-space:pre-line;background:#fffE;border:1px solid #f4dce6;border-radius:18px;padding:18px;margin:20px 0;min-height:118px}.name{display:inline-block;padding:6px 15px;border-radius:20px;background:#f28db6;color:white;font-weight:900}.name.k{background:#e9bb79;color:#493729}.muted{color:#927f8b;font-size:13px}.end{text-align:center;padding:36px 20px}.end h2{font-size:34px;color:#bd6288}.hidden{display:none}
@media(max-width:650px){main{padding:10px}.hero{grid-template-columns:1fr}.girls{gap:8px}.girl{padding:6px}.girl svg{max-height:190px}.scene{grid-template-columns:1fr;min-height:0}.portrait{height:300px}.portrait svg{height:300px}.story{padding:14px}.dialog{margin:12px 0;min-height:100px}.intro{padding:16px}}
</style></head><body><main>
<div class="top"><div class="logo">두근두근 방과 후 데이트 <span style="font-size:12px;letter-spacing:2px;display:block;color:#a88c9b">AFTER SCHOOL, WITH YOU</span></div><div class="tag">♥ 방과 후의 설렘</div></div>
<section id="home" class="panel hero">
 <div class="intro"><div class="tag">SHORT VISUAL NOVEL</div><h1>오늘은 누구와<br>함께 걸을까?</h1><p>벚꽃이 흩날리는 하굣길. 평소와 조금 다른 두 사람의 표정이 눈에 들어온다. 작은 선택 하나가 오늘의 결말을 바꿀지도 모른다.</p><p class="muted">캐릭터를 선택하고 대화 속 선택지로 호감도를 쌓아 보세요.</p><button class="pink" onclick="start('hakari')">하카리 루트 시작 ♥</button> <button class="gold" onclick="start('karane')">카라네 루트 시작 ♡</button></div>
 <div class="girls">
 <div class="girl"><svg viewBox="0 0 220 290" role="img" aria-label="분홍 머리 소녀"><path fill="#b9d9ed" d="M0 0h220v290H0z"/><path fill="#f4b3c6" d="M35 290V110Q35 10 110 12q78 0 78 100v178z"/><path fill="#f7c5d3" d="M54 95q-8-60 55-67 63 6 58 67l-7 86q-10 60-51 60-45 0-53-61z"/><path fill="#e989a9" d="M48 116Q22 15 111 7q92 3 66 116l-30-43-15-34-26 35-30 27-18 44z"/><ellipse cx="83" cy="132" rx="12" ry="15" fill="#fff"/><ellipse cx="137" cy="132" rx="12" ry="15" fill="#fff"/><circle cx="85" cy="134" r="8" fill="#57966e"/><circle cx="139" cy="134" r="8" fill="#57966e"/><path d="M96 178q14 12 28 0" fill="none" stroke="#b96c7c" stroke-width="3" stroke-linecap="round"/><path d="M30 290q5-90 80-92 75 2 80 92" fill="#514052"/><path d="M77 203l33 42 34-42" fill="#fff"/><path d="M110 245l-12 45h24z" fill="#c94e61"/></svg><h3>하나조노 하카리</h3><p>상냥하고 적극적인 소녀</p></div>
 <div class="girl"><svg viewBox="0 0 220 290" role="img" aria-label="금발 소녀"><path fill="#b5ddf4" d="M0 0h220v290H0z"/><path fill="#e7b56d" d="M26 290V94Q25 7 110 8q85 0 84 87v195z"/><path fill="#ffe0a0" d="M58 80q0-58 53-58 54 0 54 58l-5 98q-8 60-49 60-42 0-49-60z"/><path fill="#f4ca7b" d="M57 110Q20 37 91 16q65-22 83 39l-26 38-10-49-27 30-50 31z"/><path fill="#e9bd72" d="M48 102q-30 70 5 119l15-23-2-72zm124 0q30 70-5 119l-15-23 2-72z"/><ellipse cx="84" cy="130" rx="12" ry="15" fill="#fff"/><ellipse cx="137" cy="130" rx="12" ry="15" fill="#fff"/><circle cx="85" cy="132" r="8" fill="#9a8548"/><circle cx="138" cy="132" r="8" fill="#9a8548"/><path d="M98 177q13-8 25 0" fill="none" stroke="#b47c65" stroke-width="3" stroke-linecap="round"/><path d="M30 290q5-90 80-92 75 2 80 92" fill="#78564f"/><path d="M77 203l33 42 34-42" fill="#fff"/></svg><h3>인다 카라네</h3><p>솔직하지 못한 츤데레</p></div></div>
</section>
<section id="game" class="panel scene hidden">
<div class="portrait" id="portrait"></div><div class="story"><div><div class="storytop"><span id="charname" class="name">하카리</span><span class="muted">호감도 <b id="score">0</b>/100</span></div><div class="meter"><div class="fill" id="fill"></div></div><div class="dialog" id="dialog"></div></div><div id="choices"></div></div>
</section>
<section id="ending" class="panel end hidden"><div class="tag">ENDING</div><h2 id="endtitle">해피 엔딩 ♥</h2><p id="endtext"></p><p class="muted" id="endscore"></p><button class="pink" onclick="location.reload()">다시 플레이하기 ♡</button></section>
</main>
<script>
const art={
hakari:`<svg viewBox="0 0 360 500" aria-label="하카리 초상화"><defs><linearGradient id="hp" x2="0" y2="1"><stop stop-color="#f9c4d3"/><stop offset="1" stop-color="#df819e"/></linearGradient></defs><path fill="#d9eaf3" d="M0 0h360v500H0z"/><path fill="#a8d5b1" d="M280 0h80v500h-80z"/><path fill="#514052" d="M35 500q8-175 145-175 138 0 146 175"/><path fill="#fff" d="M130 328l50 85 52-85"/><path fill="#bd4e61" d="M180 400l-25 100h50z"/><path fill="url(#hp)" d="M74 170Q53 10 180 10q134 0 111 190l-10 140q-28 91-101 91-78 0-99-91z"/><path fill="#f4b0c5" d="M99 94q5-67 81-67 84 0 84 76l-8 153q-12 75-76 75-68 0-77-78z"/><path fill="#e887a5" d="M91 176Q40 10 180 8q140 0 99 179l-28-64-32-60-43 64-54 42-31 53z"/><path fill="#f4b0c5" d="M108 65q-34 87-24 181l-35 60q-19-190 59-241m144-3q52 80 28 246l-30-48 4-120z"/><path d="M124 185q25-20 47 0m29 0q25-20 47 0" fill="none" stroke="#604b54" stroke-width="8" stroke-linecap="round"/><ellipse cx="148" cy="202" rx="17" ry="21" fill="#fff"/><ellipse cx="222" cy="202" rx="17" ry="21" fill="#fff"/><circle cx="150" cy="204" r="12" fill="#5c9c72"/><circle cx="220" cy="204" r="12" fill="#5c9c72"/><circle cx="154" cy="198" r="4" fill="#fff"/><circle cx="224" cy="198" r="4" fill="#fff"/><path d="M169 275q13 12 27 0" fill="none" stroke="#b76f83" stroke-width="4" stroke-linecap="round"/><path d="M105 248l30 13m-28 0 24 9m104-22-29 13m27 0-24 9" stroke="#ef9aa9" stroke-width="4" stroke-linecap="round"/></svg>`,
karane:`<svg viewBox="0 0 360 500" aria-label="카라네 초상화"><path fill="#bfe3f8" d="M0 0h360v500H0z"/><path fill="#514052" d="M30 500q12-174 150-174 137 0 150 174"/><path fill="#fff" d="M130 328l50 85 52-85"/><path fill="#f0c67f" d="M72 135Q39 15 180 10q140 0 108 170l-12 170q-35 66-96 66-65 0-98-66z"/><path fill="#ffdfa0" d="M102 92q3-65 78-65 79 0 80 75l-8 156q-11 72-72 72-63 0-74-74z"/><path fill="#f1c879" d="M100 75Q65 12 150 8q103-4 112 78l-45-32-37 42-65 36-20 76-21-60z"/><path fill="#e8b96c" d="M75 130q-45 115 7 205l21-52-13-112m187-41q44 115-8 205l-21-52 13-112z"/><path d="M122 182q24-17 46 0m30 0q24-17 46 0" fill="none" stroke="#665447" stroke-width="8" stroke-linecap="round"/><ellipse cx="147" cy="202" rx="17" ry="21" fill="#fff"/><ellipse cx="221" cy="202" rx="17" ry="21" fill="#fff"/><circle cx="149" cy="204" r="12" fill="#9b854b"/><circle cx="219" cy="204" r="12" fill="#9b854b"/><circle cx="153" cy="198" r="4" fill="#fff"/><circle cx="223" cy="198" r="4" fill="#fff"/><path d="M166 276q14-7 28 0" fill="none" stroke="#a87565" stroke-width="4" stroke-linecap="round"/><path d="M112 246l28 8m-27 7 23 5m101-20-27 8m26 7-23 5" stroke="#e9a2a0" stroke-width="4" stroke-linecap="round"/></svg>`
};
const scenes={
hakari:[
["하나조노 하카리","어머, 여기 있었네요! 오늘 같이 집에 가지 않을래요?","물론이지!|12","무슨 이야기인데?|7","오늘은 조금 바빠…|-5"],
["하나조노 하카리","에헤헤, 사실은 당신과 조금 더 이야기하고 싶었어요.","나도 그래.|15","무슨 고민 있어?|8","그럼 천천히 걸을까?|12"],
["하나조노 하카리","벚꽃이 정말 예쁘네요. 이런 날은 특별한 추억을 만들고 싶어요.","너와 함께라서 더 예뻐.|20","사진 찍어 줄까?|12","꽃잎 잡기 내기하자!|15"]],
karane:[
["인다 카라네","뭐야, 왜 그렇게 쳐다보는 거야?! 딱히 기다린 건 아니거든!","기다려줘서 고마워.|15","같이 가자, 카라네.|12","그럼 먼저 갈게.|-6"],
["인다 카라네","흥! 네가 원한다면 같이 걸어줄 수도 있지만… 착각하지 마!","네가 있어야 즐거워.|18","오늘 기분 좋아 보여.|12","츤데레네.|-3"],
["인다 카라네","저기… 오늘은 조금 더 같이 있고 싶을지도. 너는 어때?","나도 같이 있고 싶어.|20","조금만 더 걷자.|15","부끄러워하는 거 귀여워.|8"]]
};
let route="",step=0,score=0;
function start(r){route=r;step=0;score=0;document.getElementById('home').classList.add('hidden');document.getElementById('ending').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){let s=scenes[route][step];document.getElementById('portrait').innerHTML=art[route];document.getElementById('charname').textContent=s[0];document.getElementById('charname').className='name'+(route==='karane'?' k':'');document.getElementById('score').textContent=score;document.getElementById('fill').style.width=Math.max(0,Math.min(100,score))+'%';document.getElementById('dialog').textContent=s[1];let c=document.getElementById('choices');c.innerHTML='';s.slice(2).forEach(v=>{let [label,n]=v.split('|');let b=document.createElement('button');b.className='choice';b.textContent='♥ '+label;b.onclick=()=>choose(+n);c.appendChild(b)})}
function choose(n){score=Math.max(0,Math.min(100,score+n));step++;if(step<scenes[route].length){render();return}document.getElementById('game').classList.add('hidden');document.getElementById('ending').classList.remove('hidden');let good=score>=35;document.getElementById('endtitle').textContent=good?'해피 엔딩 ♥':'조금 아쉬운 방과 후';document.getElementById('endtext').textContent=route==='hakari'?(good?'하카리는 환하게 웃으며 당신의 손을 잡았다. “오늘은 정말 행복했어요!”':'하카리는 아쉬운 듯 미소 지으며 다음을 기약했다.'):(good?'카라네는 얼굴을 붉히며 작게 속삭였다. “내일도… 같이 가자.”':'카라네는 고개를 돌렸다. “다음엔 좀 더 잘해 보라고!”');document.getElementById('endscore').textContent='최종 호감도 '+score+' / 100';}
</script></body></html>
